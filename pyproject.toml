[project]
name = "kaizen-pmm"
version = "0.2.0"
description = "Agent-run product marketing pipeline: LLM agents write each artifact, deterministic gates check it."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kaizen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
